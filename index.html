<!DOCTYPE1 html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación - Laboratorio R&D</title>
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Audio de Fondo (Opcional) -->
    <audio id="musicaFondo" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón Flotante para Control de Audio -->
    <button id="btnAudio" class="boton-audio" onclick="toggleMusica()">🎵</button>

    <!-- PANTALLA INICIAL (SOBRE INTERACTIVO) -->
    <div id="pantallaInicial" class="pantalla-inicial">
        <div id="sobreSuperior" class="solapa sobre-superior"></div>
        <div id="sobreIzquierda" class="solapa sobre-izquierda"></div>
        <div id="sobreDerecha" class="solapa sobre-derecha"></div>

        <!-- Sello Central militar / cera -->
        <div id="contenedorSello" class="sello-mariposa-container" onclick="abrirSobreConMusica()">
            <div class="sello-cera">
                <span class="iniciales-sello-brillante">R&D</span>
            </div>
        </div>

        <!-- Tarjeta Interior que se revela al abrir -->
        <div id="tarjetaInterior" class="tarjeta-interior-sobre oculto">
            <p class="sub-bodas-oro">Reunión de Equipo</p>
            <h1 class="nombres-brillantes-oro">LABORATORIO R&D</h1>
            <p class="conector-portada">20 DE NOVIEMBRE</p>
            <button class="boton-abrir-sobre" onclick="entrarInvitacionPrincipal()">ABRIR INVITACIÓN</button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DE LA INVITACIÓN -->
    <div id="contenidoPrincipal" class="invitacion-contenido oculto">
        
        <div class="invitados-selector">
            <span class="pases-texto">INVITACIÓN PARA:</span>
            <h3 id="mostrarNombreInvitado" class="nombre-invitado-pantalla">Compañero de Trabajo</h3>
        </div>

        <h2 class="subtitulo-dorado">Convivencia Revolucionaria</h2>

        <div class="bloque-texto-libre">
            <p class="frase-texto">¡Compañero(a)! Quedas cordialmente invitado(a) a celebrar nuestra tradicional convivencia del Laboratorio R&D.</p>
        </div>

        <!-- Imagen 3 con Difuminado -->
        <div class="contenedor-imagen-difusa">
            <img src="imagen3.jpg" alt="Laboratorio R&D" class="imagen-difusa-estilo">
        </div>

        <div class="espaciador-grande"></div>

        <div class="seccion-limpia">
            <div class="fecha-destacada">
                <span>20</span>
                <span class="mes">NOVIEMBRE</span>
                <span>2026</span>
            </div>
            <p class="hora-evento">A partir de las 2:00 PM</p>
            <p class="lugar-nombre">Ran
